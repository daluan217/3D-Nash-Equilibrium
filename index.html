<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/favicon-192x192.png" />
    <title>Nash Equilibrium Simulator</title>
    <!-- Apply the persisted theme BEFORE first paint. React re-applies it on
         mount, but that is too late to stop a light flash (and a light
         resize-strip) in dark mode while the bundle loads. -->
    <script>
      try {
        if (localStorage.getItem('nash_sim_theme') === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
    <!-- Google Analytics — WEB ONLY. The packaged desktop app is an offline
         math tool, so it must talk to loopback and its own domain and nothing
         else; the static tag loaded gtag unconditionally, which made
         www.google-analytics.com the packaged renderer's one non-loopback host
         (RED-DESKTOP-21/002). Same UA test App.tsx already uses for isElectron;
         window.nashDesktop (the preload bridge) is the belt-and-braces half. -->
    <script>
      (function () {
        var ua = (navigator.userAgent || '').toLowerCase();
        if (ua.indexOf('electron') !== -1 || window.nashDesktop) return;
        window.dataLayer = window.dataLayer || [];
        window.gtag = function gtag(){ dataLayer.push(arguments); };
        gtag('js', new Date());
        gtag('config', 'G-9LRR4211HX');
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-9LRR4211HX';
        document.head.appendChild(s);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
