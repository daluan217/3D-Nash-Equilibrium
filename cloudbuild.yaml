steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/nash-equilibrium-backend:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/nash-equilibrium-backend:latest'
      - '.'

  # Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/nash-equilibrium-backend:$SHORT_SHA'

  # Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'nash-equilibrium-backend'
      - '--image=gcr.io/$PROJECT_ID/nash-equilibrium-backend:$SHORT_SHA'
      - '--region=us-east1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      # ⚠️  --set-env-vars/--set-secrets declare the service's ENTIRE env list
      # on every deploy; they do NOT merge with what the running service already
      # has. Anything missing from either line is DELETED from production the
      # moment a commit lands on main. On 2026-08-31 a hand-run
      # `gcloud run services update --set-env-vars` proved this the hard way:
      # 12 minutes with no AUTH_SECRET/SMTP/GCS in prod. These two lines are the
      # single source of truth for the service's environment, and
      # src/cloudbuild.contract.test.ts fails the build if it ever drifts
      # from deploy/cloudrun-env-manifest.txt.
      #
      # The NASH_* report flags are deliberately LITERAL, not substitutions:
      # they are feature flags, not secrets, and a literal cannot be silently
      # blanked by an empty value in the Cloud Build trigger UI — which is
      # exactly how REPORT_MODEL sat empty in prod (falling back to
      # gpt-5.4-mini) while everyone believed the configured model was live.
      # Secret-bearing values are references to Secret Manager versions, never
      # substitution values. The five secret names below are public resource
      # identifiers; the secret payloads must be provisioned and granted to
      # the Cloud Run runtime service account before this deploy can succeed.
      - '--set-env-vars=NODE_ENV=production,SMTP_HOST=${_SMTP_HOST},SMTP_PORT=${_SMTP_PORT},SMTP_FROM=${_SMTP_FROM},GCS_BUCKET_NAME=${_GCS_BUCKET_NAME},TRUST_PROXY=${_TRUST_PROXY},AZURE_FOUNDRY_ENDPOINT=${_AZURE_FOUNDRY_ENDPOINT},REPORT_MODEL=${_REPORT_MODEL},NASH_PAYOFF_TEMPLATE=1,NASH_LLM_TIES=template,NASH_DIRECTION_CHECKS=1,NASH_SCENARIO_REGEN=0'
      - '--set-secrets=SMTP_USER=${_SMTP_USER_SECRET}:latest,SMTP_PASS=${_SMTP_PASS_SECRET}:latest,ADMIN_SECRET=${_ADMIN_SECRET_SECRET}:latest,AUTH_SECRET=${_AUTH_SECRET_SECRET}:latest,AZURE_FOUNDRY_API_KEY=${_AZURE_FOUNDRY_API_KEY_SECRET}:latest'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--timeout=3600'
      # Capped at ONE instance (director's call, accepted by Daniel). Two
      # standing single-process assumptions make more than one instance an
      # active correctness hazard, not just a scaling knob: AUTH_SECRET falls
      # back to a random PER-PROCESS key when unset, so a second instance
      # would silently invalidate sessions minted by the first (and
      # cold-starts flip which instance answers a given request); and
      # db.json is a single local file with non-atomic writes, so two
      # instances writing concurrently can torn-write or lose an update.
      # Neither is fixed by this cap -- it just keeps prod at the ONE
      # instance those assumptions were true under, instead of only
      # accidentally.
      - '--max-instances=1'

images:
  - 'gcr.io/$PROJECT_ID/nash-equilibrium-backend:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/nash-equilibrium-backend:latest'

options:
  logging: CLOUD_LOGGING_ONLY

# Substitutions for environment variables (set these in Cloud Build trigger)
# Do NOT hardcode real values here — configure them in the Cloud Build trigger UI instead
substitutions:
  _SMTP_HOST: 'smtp.gmail.com'
  _SMTP_PORT: '465'
  _SMTP_FROM: '"Nash Equilibrium Simulator" <your-email@gmail.com>'
  _GCS_BUCKET_NAME: 'your-gcs-bucket-name'
  # These are Secret Manager resource names, not secret payloads. A trigger may
  # override them for a project-specific naming convention, but must never put
  # the credential itself in a Cloud Build substitution.
  _SMTP_USER_SECRET: 'nash-equilibrium-smtp-user'
  _SMTP_PASS_SECRET: 'nash-equilibrium-smtp-pass'
  _ADMIN_SECRET_SECRET: 'nash-equilibrium-admin-secret'
  _AUTH_SECRET_SECRET: 'nash-equilibrium-auth-secret'
  # Trust the Cloud Run front-end proxy so rate limiting keys on the real client
  # IP (req.ip) rather than the proxy. "1" = trust one hop, correct for Cloud Run.
  _TRUST_PROXY: '1'
  # Microsoft Foundry endpoint is not itself a credential and remains a normal
  # environment value. The API key is injected from Secret Manager below.
  _AZURE_FOUNDRY_ENDPOINT: ''
  _AZURE_FOUNDRY_API_KEY_SECRET: 'nash-equilibrium-azure-foundry-api-key'
  # The report model. gpt-5.6-luna is what production runs (rung-3 scenario
  # invention); it is NOT a secret, so the real value lives here in review,
  # not in the trigger UI. An EMPTY value here or in the Cloud Build trigger
  # silently falls back to DEFAULT_MODEL in src/utils/report.ts — invisible
  # from the outside, which is how prod ran gpt-5.4-mini unnoticed. If the
  # trigger UI still defines _REPORT_MODEL, its value WINS over this default:
  # clear it there, or keep the two in sync.
  _REPORT_MODEL: 'gpt-5.6-luna'
