name: Test

# The testing pyramid. Four staged jobs, all REQUIRED before a merge to main
# (and main auto-deploys — the web app via Netlify, the DMG via
# release-desktop.yml, which itself now waits on this workflow):
#
#   unit        — type-check, unit tables (pure-function contracts), regression
#                 suites, property/fuzz, tie-prose verifier
#   build       — the production bundle itself (`npm run build`); catches the
#                 Vite/esbuild breakage class CI could not see before
#   integration — boots dist/server.cjs and exercises the real HTTP API:
#                 auth lifecycle, saved-game CRUD, CORS preflight (the desktop
#                 save path), clamping/validation, security headers
#   e2e         — drives the REAL bundle in headless Chromium: cold load,
#                 matrix input, solver convergence, the tab-wedge fixture,
#                 regret mode, run-clearing invariants, and the no-key
#                 deterministic report path. No LLM keys, no SMTP — deterministic.
#
# Cross-cutting guards: every job carries a timeout (a hung SwiftShader frame
# must fail the check, not burn six hours of runner time), PR runs cancel
# superseded ones, the unit job audits production dependencies at the critical
# level, and the build job scans the bundle for secret-shaped strings and
# enforces a size budget (Plotly already dominates it — the budget catches a
# duplicate heavy import, not a few KB).
#
# Node 22 matches the version release-desktop.yml already proves green in
# Actions; CI never sees the local machine's default Node, so the Node 26 Vite
# hang documented for local dev is not a concern here.
on:
  push:
    branches: [main, review-mirror]
  pull_request:

# a new push to a PR supersedes its older runs — cancel them instead of
# queueing stale results behind fresh ones
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # iCloud/Finder duplicate a file mid-copy as "name 2.ext"; one of these
      # was committed and shipped as untested "coverage" of stale behaviour.
      # No npm install needed for this one, so it runs first and fails fast.
      - name: No Finder/iCloud duplicate files ("name 2.ext") are tracked
        run: |
          # Only flag "name N.ext" when "name.ext" is also tracked — the
          # Finder/iCloud mid-copy shape, not an ordinary numbered filename
          # (e.g. "Figure 1.png").
          dupes="$(git ls-files | awk -F/ '{ f=$NF } f ~ / [0-9]+\.[A-Za-z0-9]+$/ { print }' \
            | while IFS= read -r p; do
                orig="$(printf '%s' "$p" | sed -E 's/ [0-9]+(\.[A-Za-z0-9]+)$/\1/')"
                # An explicit conditional: under the runner's `bash -e`, a bare
                # `cmd && echo` whose lookup fails on the LAST entry makes the
                # loop — and the assignment — exit 1 before the check below
                # runs, so an innocent "Figure 1.png" with no "Figure.png"
                # failed the job and a real duplicate earlier in the list was
                # reported as a silent failure (reproduced under bash -e).
                if git ls-files --error-unmatch -- "$orig" >/dev/null 2>&1; then
                  echo "$p"
                fi
              done)"
          if [ -n "$dupes" ]; then
            echo "Tracked file(s) matching the Finder/iCloud duplicate-copy shape:"
            echo "$dupes"
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Audit production dependencies (critical advisories fail the build)
        run: npm audit --omit=dev --audit-level=critical

      - name: Run test suites
        run: npm test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Scan the bundle for secret-shaped strings
        run: |
          if grep -rEn 'sk-[A-Za-z0-9]{20}|ghp_[A-Za-z0-9]{30}|gho_[A-Za-z0-9]{30}|AIza[0-9A-Za-z_-]{30}|-----BEGIN [A-Z ]*PRIVATE KEY-----|eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.[A-Za-z0-9_-]{20}' dist/ ; then
            echo "::error::secret-shaped string found in the shipped bundle"
            exit 1
          fi
          echo "bundle clean of secret-shaped strings"

      - name: Enforce the bundle size budget (10 MB)
        run: |
          kb=$(du -sk dist/assets | cut -f1)
          echo "dist/assets is ${kb} KB"
          if [ "$kb" -gt 10240 ]; then
            echo "::error::dist/assets exceeds the 10 MB budget — did a heavy dependency get imported twice?"
            exit 1
          fi

      - name: Upload bundle for the e2e job
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 3
          if-no-files-found: error

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download the bundle built by the build job
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Boot the production server and run the API suite
        run: node src/integration/api.test.mjs
        env:
          INTEGRATION_PORT: '3098'
          INTEGRATION_BASE: http://localhost:3098

      # The desktop's persistence guarantees, booted from a temp cwd so dotenv
      # loads nothing — the packaged condition. Guards two defects RED-DESKTOP
      # found in the real .app: a per-launch session secret that signed the user
      # out on every restart, and a truncating db.json write that turned an
      # unreadable database into a deleted one.
      - name: Boot the production server and run the desktop persistence suite
        run: node src/integration/desktop-persistence.test.mjs
        env:
          DESKTOP_PERSIST_PORT: '3104'

      # Every scenario-invention path draws, screens and REROLLS the same way.
      # Counts PROVIDER CALLS against a mock, because a missing retry is
      # invisible to any assertion on the response body.
      - name: Boot the production server and run the scenario-parity suite
        run: node src/integration/scenario-parity.test.mjs
        env:
          PARITY_PORT: '3106'

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download the bundle built by the build job
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium

      - name: Boot the production server and run the smoke suite
        # One automatic retry: GitHub's 2-core SwiftShader runners
        # occasionally stall a frame for minutes (observed: a 120s click
        # actionability timeout with zero console errors, on a suite that
        # passed identical code on the previous run). A real regression
        # fails both attempts; a stalled runner gets a second chance.
        # The outcome is recorded so a PASS-AFTER-RETRY still uploads the
        # first attempt's stall evidence (failure() alone is false there).
        id: smoke
        run: |
          if node src/e2e/smoke.mjs; then
            echo "smoke_outcome=pass" >> "$GITHUB_OUTPUT"
          elif node src/e2e/smoke.mjs; then
            echo "smoke_outcome=pass-after-retry" >> "$GITHUB_OUTPUT"
          else
            echo "smoke_outcome=fail" >> "$GITHUB_OUTPUT"
            exit 1
          fi
        env:
          E2E_PORT: '3099'
          E2E_BASE: http://localhost:3099

      - name: Run the AI-surface suite
        # The controls that CONSUME a model response — "Explain this game" and
        # the generate-a-new-game dialog. Added because "Generate" discarded a
        # perfectly good scenario on EVERY generation for about a day, told the
        # user the AI was unavailable, and no suite noticed: the smoke suite
        # drives the SIMULATION and never opens that dialog. A 100%-reproducible
        # user-facing failure behind a button nothing pressed.
        #
        # Runs with NO provider credentials. The API is stubbed with the exact
        # envelope production returns (source 'template', validation null), so
        # it is fast, deterministic, and tests the thing that actually broke —
        # how the UI reads the envelope, not what the model writes.
        # Mutation-verified: 4/7 against the pre-fix condition, 7/7 after.
        run: |
          if node src/e2e/ai-surface.mjs; then
            echo "ai_surface=pass" >> "$GITHUB_OUTPUT"
          elif node src/e2e/ai-surface.mjs; then
            echo "ai_surface=pass-after-retry" >> "$GITHUB_OUTPUT"
          else
            echo "ai_surface=fail" >> "$GITHUB_OUTPUT"
            exit 1
          fi
        env:
          E2E_PORT: '3098'
          E2E_BASE: http://localhost:3098

      - name: Upload failure evidence (screenshot + page HTML)
        # runs whenever the suite did not pass clean on the first attempt —
        # including the pass-after-retry case, whose evidence is exactly the
        # transient-stall picture worth keeping. if-no-files-found: ignore
        # keeps this a no-op when the suite passed without any failure.
        if: always() && steps.smoke.outputs.smoke_outcome != 'pass'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-evidence
          path: |
            /tmp/e2e_smoke_failure.png
            /tmp/e2e_smoke_failure.html
          retention-days: 7
          if-no-files-found: ignore

  # The container Cloud Run actually runs. Until now nothing built it before
  # production did: Cloud Build builds this Dockerfile on push to main, main
  # auto-deploys, so a Dockerfile that does not build — or builds an image that
  # does not start — took the live site down with no gate in front of it. The
  # four jobs above all test the SOURCE; this tests the artifact.
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Build the image Cloud Build would build
        run: docker build -t nash-ci:test .

      # Cloud Run INJECTS $PORT and expects the container to listen on it.
      # 8080 is deliberately not the Dockerfile's EXPOSE 3000: a server that
      # hardcoded its port would pass a test run on 3000 and fail in
      # production. No application env vars are supplied either — that is a
      # fresh deploy whose environment went missing, and the container must
      # still start and serve rather than crash-loop. (2026-08-31: production
      # ran for 12 minutes with most of its environment gone. It stayed up.
      # This keeps that true.)
      - name: Start it the way Cloud Run does
        run: |
          docker run -d --name nash-ci -e PORT=8080 -p 8080:8080 nash-ci:test
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/health >/dev/null 2>&1; then
              echo "container answered /api/health after ~$((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "::error::the container never answered on \$PORT within 120s"
          docker logs nash-ci || true
          exit 1

      - name: The container serves the built frontend
        run: |
          set -euo pipefail
          body=$(curl -fsS http://localhost:8080/)
          echo "$body" | grep -q 'assets/index-' \
            || { echo "::error::the page does not reference a built asset — dist/ is missing from the image"; exit 1; }
          asset=$(echo "$body" | grep -o 'assets/index-[A-Za-z0-9_-]*\.js' | head -1)
          curl -fsS "http://localhost:8080/$asset" > /dev/null \
            || { echo "::error::the hashed bundle $asset 404s inside the image"; exit 1; }
          echo "serves $asset"

      # No provider key is present in the image, so the report route must take
      # its documented deterministic path rather than erroring. This is the
      # same contract the e2e job asserts, checked against the real container.
      - name: The report route degrades to the deterministic path
        run: |
          set -euo pipefail
          out=$(curl -fsS -X POST http://localhost:8080/api/report \
            -H 'content-type: application/json' \
            -d '{"payoffs":{"a11":-2,"a12":1,"a21":1,"a22":0,"b11":1,"b12":-2,"b21":-2,"b22":1}}')
          echo "$out" | grep -q '"source":"deterministic"' \
            || { echo "::error::unkeyed container did not fall back to the deterministic report"; echo "$out" | head -c 400; exit 1; }

      - name: Container logs (on failure)
        if: failure()
        run: docker logs nash-ci || true

      - name: Stop the container
        if: always()
        run: docker rm -f nash-ci || true

  # Phones and tablets. Every job above drives a 1440x1000 desktop viewport, so
  # nothing in CI could see a layout that overflows on a phone, a control too
  # small for a thumb, or the thing a desktop runner structurally cannot show:
  # a device with a fraction of the compute. This runs the real production
  # bundle on three device profiles and then again under 4x CPU throttling
  # (Lighthouse's "mobile" setting).
  #
  # Budgets are deliberately loose — CI renders WebGL through SwiftShader on two
  # cores, so exact milliseconds are noise. These catch "the app no longer works
  # on a phone", not a 200ms regression.
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download the bundle built by the build job
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the device + compute suite
        id: mobile
        run: |
          if node src/e2e/mobile.mjs; then
            echo "mobile_outcome=pass" >> "$GITHUB_OUTPUT"
          elif node src/e2e/mobile.mjs; then
            echo "mobile_outcome=pass-after-retry" >> "$GITHUB_OUTPUT"
          else
            echo "mobile_outcome=fail" >> "$GITHUB_OUTPUT"
            exit 1
          fi
        env:
          MOBILE_PORT: '3097'
          MOBILE_BASE: http://localhost:3097
