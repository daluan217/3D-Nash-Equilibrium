name: Test

# The testing pyramid. Three staged jobs, all REQUIRED before a merge to main
# (and main auto-deploys — the web app via Netlify, the DMG via
# release-desktop.yml, which itself now waits on this workflow):
#
#   unit  — type-check, regression suites, property/fuzz, tie-prose verifier
#   build — the production bundle itself (`npm run build`); catches the Vite/
#           esbuild breakage class CI could not see before
#   e2e   — boots dist/server.cjs and drives the REAL bundle in headless
#           Chromium: cold load, matrix input, solver convergence, the tab-wedge
#           fixture, regret mode, run-clearing invariants, and the no-key
#           deterministic report path. No LLM keys, no SMTP — deterministic.
#
# Node 22 matches the version release-desktop.yml already proves green in
# Actions; CI never sees the local machine's default Node, so the Node 26 Vite
# hang documented for local dev is not a concern here.
on:
  push:
    branches: [main, review-mirror]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Run test suites
        run: npm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Upload bundle for the e2e job
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 3
          if-no-files-found: error

  e2e:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download the bundle built by the build job
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium

      - name: Boot the production server and run the smoke suite
        run: node src/e2e/smoke.mjs
        env:
          E2E_PORT: '3099'
          E2E_BASE: http://localhost:3099
