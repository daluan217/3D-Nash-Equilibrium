name: Live smoke

# The POST-DEPLOY layer of the testing pyramid. Everything in Test runs on a
# GitHub runner against the build artifact; this workflow verifies what the
# user actually receives — the live nash-equilibrium-simulator.com — after a
# merge to main deploys (web + API behind one domain). Read-only: no accounts,
# no saved games, no model calls.
#
# Three triggers:
#   workflow_run — Deploy site succeeded on main (i.e. a merge just deployed).
#                  Builds the bundle for that exact commit, polls the live site
#                  until it serves THAT commit's hashed asset (the deploy
#                  landed, not a stale cache), then runs the live checks.
#   schedule     — nightly monitor: the same checks without the hash wait,
#                  catching outages and drift between ships.
#   dispatch     — the same, on demand.
on:
  workflow_run:
    workflows: ['Deploy site']
    types: [completed]
    # main only (Deploy site only runs on main, but the filter keeps a
    # dispatch-on-a-branch from spawning a skipped row). The job-level `if:`
    # stays the gate.
    branches: [main]
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # workflow_run also fires on Deploy site failures — only a green deploy on
    # main is worth verifying. Scheduled/dispatch runs take the monitor path.
    if: >-
      github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.head_branch == 'main')
    steps:
      # Under workflow_run GITHUB_SHA is the DEFAULT BRANCH HEAD, not the commit
      # the triggering Deploy site run shipped. Unpinned, this reads package.json and runs
      # live-smoke.mjs from whatever landed on main most recently, while comparing
      # against the bundle from a different commit — the version mismatch would
      # read as a stale deploy. On the nightly/dispatch runs there is no
      # workflow_run event, so the fallback is the right ref for a monitor.
      # The sha Deploy site actually deployed (its artifact) — on a dispatch
      # with an explicit sha this is NOT the run's head_sha. Nightly/dispatch
      # monitor runs have no upstream run and fall back to github.sha.
      - name: Read the deployed sha from the Deploy site run
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          name: deployed-sha
          path: deployed-sha
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - id: sha
        name: Resolve the ref to verify
        env:
          FALLBACK: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -s deployed-sha/deployed-sha.txt ]; then sha=$(tr -d '[:space:]' < deployed-sha/deployed-sha.txt); else sha="$FALLBACK"; fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"; echo "verifying $sha"
      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.sha.outputs.sha }}
          persist-credentials: false

      - name: Read the repo version (informational comparison)
        run: echo "REPO_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      # The bundle for the deployed commit — its index.html names the exact
      # hashed asset the live deploy must serve. Built here from the pinned
      # ref (Vite's asset hash is a function of the source), since there is no
      # Test run on main to download it from any more.
      - uses: actions/setup-node@v5
        if: github.event_name == 'workflow_run'
        with:
          node-version: 22
          cache: npm
      - name: Build the bundle for the deployed commit
        if: github.event_name == 'workflow_run'
        run: |
          npm ci
          npm run build

      - name: Verify the live site (deploy-verify mode)
        if: github.event_name == 'workflow_run'
        run: node src/e2e/live-smoke.mjs
        env:
          LIVE_BASE: https://nash-equilibrium-simulator.com
          EXPECTED_INDEX: dist/index.html
          EXPECTED_VERSION: ${{ env.REPO_VERSION }}
          LIVE_WAIT_MINUTES: '5'
          # Deploy-verify only: a merge is exactly when a --set-env-vars
          # regression would land, so this run pays for the two model calls
          # that prove the rung-3 flags and provider creds survived it. The
          # nightly monitor below stays model-free.
          LIVE_DEEP: '1'

      - name: Verify the live site (monitor mode)
        if: github.event_name != 'workflow_run'
        run: node src/e2e/live-smoke.mjs
        env:
          LIVE_BASE: https://nash-equilibrium-simulator.com
          EXPECTED_VERSION: ${{ env.REPO_VERSION }}
