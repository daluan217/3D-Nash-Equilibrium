name: Build & Publish macOS DMG

# Builds the macOS desktop app and uploads it to the GCS bucket so the website
# always serves the latest version. A .dmg can only be built on macOS, so this
# runs on a macOS runner (not Cloud Build, which is Linux).
#
# SHIP GATE: this publishes to live users, so it no longer fires on the raw
# push to main — it fires when the Test workflow (the full unit → build → e2e
# pyramid) completes successfully on main. A failing pyramid can therefore
# never reach the DMG download. workflow_run only triggers from the default
# branch, which is exactly the ship path; workflow_dispatch stays for manual
# rebuilds of a known-good main.
on:
  workflow_run:
    workflows: ['Test']
    types: [completed]
  workflow_dispatch:

# Only one release build at a time; newer pushes cancel in-flight ones.
concurrency:
  group: release-desktop
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-macos:
    # the ship gate itself: publish only when the pyramid that ran on the same
    # commit SUCCEEDED (workflow_run also fires on failure — without this the
    # gate would be decorative). Manual dispatch of a known-good main is allowed.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Auth happens BEFORE the build now: the DMG ships the offline explainer
      # (Daniel's one-package decision, 2026-08-31), and the model comes out of
      # GCS at build time — a 600MB GGUF has no business in git.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Bundle the offline explainer (llama-server + model)
        env:
          # The shipping local model. Swap this one line to ship a different one.
          # Q4_K_M over Q8_0 on measurement, not guesswork: identical yield
          # (96.7%), identical diversity (60/60 distinct, 1.7% top share),
          # identical domain adherence (100%) on the same 60 held-out games —
          # and faster (p50 1.27s vs 1.46s) at 378MB vs 610MB. A ~510MB DMG
          # instead of ~740MB, for free. Swap one line to ship the Q8.
          MODEL_URI: gs://nash-finetune-d-nash-equilibrium/gguf_scenario/nash-scenario-domain-0.6b-Q4_K_M.gguf
          # Pinned llama.cpp release for the server binary; bump deliberately.
          LLAMA_TAG: b10727
          # ...and pinned by CONTENT, not just by tag. This binary is copied
          # into a signed application we hand to users, so a tag that silently
          # changed underneath us — or a download tampered with in transit —
          # must fail the build rather than ship. Recompute with:
          #   shasum -a 256 llama-<tag>-bin-macos-arm64.tar.gz
          LLAMA_SHA256: 35dff6db3b8a94ca64047223fea43c1bd574bf5af0030f37e6a0d92c53fa529e
        run: |
          set -euo pipefail
          mkdir -p local-model
          echo "fetching model: $MODEL_URI"
          gcloud storage cp "$MODEL_URI" local-model/
          echo "fetching llama-server ($LLAMA_TAG, macos-arm64)"
          curl -fsSL -o /tmp/llama.tar.gz \
            "https://github.com/ggml-org/llama.cpp/releases/download/$LLAMA_TAG/llama-$LLAMA_TAG-bin-macos-arm64.tar.gz"
          echo "$LLAMA_SHA256  /tmp/llama.tar.gz" | shasum -a 256 -c - \
            || { echo "::error::llama.cpp archive digest mismatch — refusing to package it"; exit 1; }
          tar -xzf /tmp/llama.tar.gz -C /tmp
          # The release layout is FLAT: llama-$LLAMA_TAG/{llama-server,*.dylib}.
          # llama-server is a thin shim that resolves its dylibs via @rpath next
          # to itself, so the binary and every dylib travel together.
          cp "/tmp/llama-$LLAMA_TAG/llama-server" local-model/
          cp "/tmp/llama-$LLAMA_TAG/"*.dylib local-model/
          chmod +x local-model/llama-server
          ls -la local-model/ | awk '{print $5, $9}'
          # Refuse to ship a bundle that cannot possibly work.
          test -s local-model/llama-server
          ls local-model/*.gguf >/dev/null

      - name: Build macOS DMG
        # Build the bundle, then package. --publish never stops electron-builder
        # from trying to push a GitHub release (we upload to GCS ourselves).
        run: |
          npm run build
          npx electron-builder --publish never

      - name: Upload DMG and version manifest to GCS
        env:
          BUCKET: ${{ secrets.GCS_BUCKET_NAME }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          # electron-builder names the file "<productName>-<version>.dmg";
          # the website expects the fixed object name, so we rename on upload.
          dmgs=(dist-electron/*.dmg)
          if [ ${#dmgs[@]} -eq 0 ]; then
            echo "::error::No .dmg produced in dist-electron/" >&2
            exit 1
          fi
          DMG_PATH="${dmgs[0]}"

          VERSION="$(node -p "require('./package.json').version")"
          echo "Uploading '$DMG_PATH' (v$VERSION) -> gs://$BUCKET/Nash Equilibrium Simulator.dmg"

          gcloud storage cp "$DMG_PATH" "gs://$BUCKET/Nash Equilibrium Simulator.dmg" \
            --cache-control="no-cache, max-age=0"

          printf '{"version":"%s"}' "$VERSION" > app-version.json
          gcloud storage cp app-version.json "gs://$BUCKET/app-version.json" \
            --cache-control="no-store"
