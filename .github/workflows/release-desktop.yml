name: Build & Publish macOS DMG

# Builds the macOS desktop app and uploads it to the GCS bucket so the website
# always serves the latest version. A .dmg can only be built on macOS, so this
# runs on a macOS runner (not Cloud Build, which is Linux).
#
# SHIP GATE: this publishes to live users, so it no longer fires on the raw
# push to main — it fires when Live smoke completes successfully on main,
# which itself fires only after Deploy site verified the merged PR head's
# checks and ran Cloud Build to completion. workflow_run only triggers from the default
# branch, which is exactly the ship path; workflow_dispatch stays for manual
# rebuilds of a known-good main.
# The DMG ships only AFTER the live site has been verified, not merely after
# the tests passed. Daniel's rule, and the reason is the desktop app's whole
# value: it is the offline copy of a product whose online copy we have just
# confirmed works. Releasing on Test alone would ship a desktop build whose
# matching deploy might never have come up — Live smoke is the workflow that
# waits for the deploy to actually serve this commit's asset hash and then
# checks the live surfaces, so that is what this waits on.
on:
  workflow_run:
    workflows: ['Live smoke']
    types: [completed]
    branches: [main]   # see deploy-site.yml — filters noise, the `if:` gates
  workflow_dispatch:

# Only one release build at a time. A newer push QUEUES behind an in-flight
# release instead of cancelling it (CodeRabbit on #176, twice): the publish
# step is two GCS writes — the fixed-name DMG, then app-version.json — and a
# cancel between them leaves a DMG newer than the manifest says. The
# duplicate-version guard then makes the queued run refuse the same version.
concurrency:
  group: release-desktop
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-macos:
    # the ship gate itself: publish only when the pyramid that ran on the same
    # commit SUCCEEDED (workflow_run also fires on failure — without this the
    # gate would be decorative). Manual dispatch of a known-good main is allowed.
    # `event == 'workflow_run'` is load-bearing, not belt-and-braces. Live smoke
    # has three triggers: the deploy-verify run that Test starts after a merge,
    # a NIGHTLY schedule, and manual dispatch. Without this clause the nightly
    # monitor — which passes every night against a site nobody just changed —
    # would cut a fresh DMG release at 03:41 every morning. We ship only on the
    # run that actually verified THIS commit's deploy.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'workflow_run')
    runs-on: macos-latest
    steps:
      # workflow_run resets GITHUB_SHA to the DEFAULT BRANCH HEAD, not the
      # commit that was verified. Without an explicit ref, a merge landing on
      # main between Live smoke finishing and this job starting would be built
      # into the DMG having never been smoke-tested — the exact hole this whole
      # gating chain exists to close. head_sha is the verified commit (checked
      # against a real run: Live smoke's head_sha == the Test commit's sha);
      # the fallback covers workflow_dispatch, where the event object is empty.
      # No step here pushes to git (the DMG goes to GCS), so drop the token.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS DMG
        # Build the bundle, then package. --publish never stops electron-builder
        # from trying to push a GitHub release (we upload to GCS ourselves).
        run: |
          npm run build
          npx electron-builder --publish never

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Upload DMG and version manifest to GCS
        env:
          BUCKET: ${{ secrets.GCS_BUCKET_NAME }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          # electron-builder names the file "<productName>-<version>.dmg";
          # the website expects the fixed object name, so we rename on upload.
          dmgs=(dist-electron/*.dmg)
          if [ ${#dmgs[@]} -eq 0 ]; then
            echo "::error::No .dmg produced in dist-electron/" >&2
            exit 1
          fi
          DMG_PATH="${dmgs[0]}"

          VERSION="$(node -p "require('./package.json').version")"

          # RED-DESKTOP-19/002: the DMG and the manifest live at FIXED object names and the
          # installed app only ever compares version strings, so publishing a second build
          # under an unchanged version silently overwrites the first and no installed copy
          # of it will ever be offered the update (0.0.193 shipped twice on 2026-09-08).
          # Refuse to republish a version that is already live; the fix is a bump.
          # The built commit is the one Live smoke verified (workflow_run head), never
          # GITHUB_SHA, which under workflow_run is whatever main's head is right now.
          BUILD_SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          PUBLISHED=""
          if manifest="$(gcloud storage cat "gs://$BUCKET/app-version.json" 2>&1)"; then
            # A manifest that exists but cannot be parsed is a broken release state, not "unpublished".
            PUBLISHED="$(printf '%s' "$manifest" | node -e "const v=JSON.parse(require('fs').readFileSync(0,'utf8')).version; if(typeof v!=='string'||!v) throw new Error('app-version.json has no version'); process.stdout.write(v)")"
          elif printf '%s' "$manifest" | grep -qiE 'not found|no such object|does not exist|no urls matched|404'; then
            echo "no app-version.json published yet — first desktop release"
          else
            echo "::error::could not read gs://$BUCKET/app-version.json: $manifest" >&2
            exit 1
          fi
          if [ -n "$PUBLISHED" ] && [ "$PUBLISHED" = "$VERSION" ]; then
            echo "::error::version $VERSION is already published (app-version.json); bump package.json before shipping another desktop build" >&2
            exit 1
          fi
          echo "Uploading '$DMG_PATH' (v$VERSION, build ${BUILD_SHA::7}) -> gs://$BUCKET/Nash Equilibrium Simulator.dmg"

          gcloud storage cp "$DMG_PATH" "gs://$BUCKET/Nash Equilibrium Simulator.dmg" \
            --cache-control="no-cache, max-age=0"

          printf '{"version":"%s","build":"%s"}' "$VERSION" "$BUILD_SHA" > app-version.json
          gcloud storage cp app-version.json "gs://$BUCKET/app-version.json" \
            --cache-control="no-store"
