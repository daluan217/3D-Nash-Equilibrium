name: Report Eval

# Sweeps the golden set across models and records factual-consistency, latency,
# and cost for the grounded LLM report. Advisory in v1 — it does not gate merges
# or releases. Gating a tag on a recent green eval is the sensible follow-up, but
# blocking every push on a paid, network-dependent model sweep is not.
#
# MAIN ONLY, and manual/scheduled only: it needs a real GEMINI_API_KEY, which
# must never run in review-mirror's context (the anonymized reviewer branch).
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC

permissions:
  contents: read

jobs:
  eval:
    # Guard the scheduled run against forks and any non-main ref.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run report eval sweep
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EVAL_OUT: eval-results.json
        run: npm run eval

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval-results.json
