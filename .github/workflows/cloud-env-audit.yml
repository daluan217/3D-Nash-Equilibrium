name: Cloud Run env audit

# The layer of the pyramid that watches the DEPLOYED service rather than the
# repo. Everything else — unit, build, integration, e2e, live smoke — verifies
# code and behaviour. None of them can see that production is missing an
# environment variable, because a missing variable does not throw: auth quietly
# stops persisting sessions, mail quietly stops sending, and the report surface
# quietly falls back a rung while every HTTP check still returns 200.
#
# That is not theoretical. On 2026-08-31 a hand-run
# `gcloud run services update --set-env-vars` REPLACED the service's whole
# environment (the flag does not merge) and production ran for ~12 minutes with
# no AUTH_SECRET, GCS_BUCKET_NAME, SMTP_* or provider credentials. Nothing in CI
# noticed; a human did.
#
# Two guards now exist, and they cover different halves:
#   src/cloudbuild.contract.test.ts  — the repo's deploy config (credential-free,
#                                      runs on every PR in `npm test`)
#   this workflow                    — the live service (needs GCP credentials)
#
# The second is necessary because the Cloud Build trigger UI can override any
# substitution, and a human can always run gcloud by hand. Only the deployed
# service knows what production actually has.
#
# SAFE METADATA ONLY: the audit compares variable names and Secret Manager
# reference metadata against the reviewed deployment. Its Cloud Run v2
# server-side response masks never request EnvVar.value, so credential payloads
# cannot reach this process or a public log.
#
# DEPLOY TOPOLOGY, since it cost an hour to find: a push to main fires the
# Cloud Build trigger `2ndTrigger`, which lives in **us-west2** — not global,
# not us-east1 where the Cloud Run service runs. `gcloud builds triggers list`
# and `gcloud builds list` both return "Listed 0 items" unless you pass
# --region=us-west2, which makes the whole pipeline look like it does not
# exist. The trigger runs cloudbuild.yaml on branch ^main$ as the compute
# service account. It defines 9 substitutions; _REPORT_MODEL, _SMTP_HOST and
# _SMTP_PORT are NOT among them, so those take cloudbuild.yaml's defaults.
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # only used by the Workload Identity Federation path

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUN_API: https://run.googleapis.com/v2
      SERVICE_RESOURCE: projects/d-nash-equilibrium/locations/us-east1/services/nash-equilibrium-backend
      # Cloud API `fields` is a SERVER-SIDE partial-response mask. These exact
      # masks intentionally omit EnvVar.value, so literal credentials never
      # cross the API boundary into the runner or the curl process.
      SERVICE_FIELDS: template.containers.env.name,template.containers.env.valueSource.secretKeyRef,traffic.type,traffic.revision,traffic.percent,trafficStatuses.type,trafficStatuses.revision,trafficStatuses.percent,latestReadyRevision
      REVISION_FIELDS: containers.env.name,containers.env.valueSource.secretKeyRef
    steps:
      - uses: actions/checkout@v5

      # This audit has its own OIDC-only, read-only identity. Missing or broken
      # credentials must fail the audit loudly; silently skipping would turn
      # the live guard back into a vacuous green check. The provider is
      # restricted in GCP to this repository's refs/heads/main identity.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_AUDIT_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_AUDIT_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      # Cloud Run's REST endpoint is used directly because `gcloud --format`
      # filters a full response only AFTER it reaches the runner. The `fields`
      # query parameter below is a server-side response mask, so only names,
      # Secret Manager reference metadata, and traffic metadata are returned.
      # TWO things must match the manifest, and the 2026-08-31 incident is
      # precisely why they are checked separately:
      #
      #   spec.template          what the NEXT deploy will create
      #   status.traffic[]       what users are being served RIGHT NOW
      #
      # A traffic rollback repairs serving while leaving the stored template
      # broken (that is exactly how the incident was mitigated, and why the
      # spec had to be fixed afterwards too). A bad deploy does the reverse.
      # Auditing only one of them would call each of those situations healthy.
      - name: Audit the deployed environment against the manifest
        run: |
          set -euo pipefail
          rc=0

          # Never merge stderr into this variable or echo it: a successful
          # command must leave the variable containing only the bearer token,
          # and a failed command must not risk putting one in the public log.
          if ! access_token=$(gcloud auth print-access-token); then
            echo "::error::Could not mint the short-lived OIDC access token"
            exit 1
          fi
          api_get() {
            local resource="$1"
            local fields="$2"
            curl --silent --show-error --fail-with-body --get \
              --header "Authorization: Bearer $access_token" \
              --data-urlencode "fields=$fields" \
              "$RUN_API/$resource"
          }

          # Capture separately from the pipe so an authentication/permission
          # error is reported as itself rather than as "no env variables".
          if ! service_metadata=$(api_get "$SERVICE_RESOURCE" "$SERVICE_FIELDS" 2>&1); then
            echo "::error::Could not read safe Cloud Run metadata. If this says PERMISSION_DENIED, \
            github-cloudrun-auditor needs service-scoped roles/run.viewer on $SERVICE_RESOURCE. \
            Grant it only after the formerly literal credentials have been rotated, so retained \
            historical revisions no longer contain usable credential values."
            echo "$service_metadata"
            exit 1
          fi

          echo "── template (what the next deploy will create)"
          printf '%s' "$service_metadata" | node src/deploy/env-audit.mjs || rc=1

          # Every revision with a non-zero share, not just the newest: a split
          # or a rollback can serve an environment the template knows nothing
          # about. The helper also fails if the newest ready revision receives
          # no traffic, and warns if desired traffic is pinned by revision.
          if ! revisions=$(printf '%s' "$service_metadata" | node src/deploy/cloud-run-traffic.mjs); then
            exit 1
          fi
          for revision in $revisions; do
            short_revision="${revision##*/}"
            echo "── serving revision $short_revision"
            if ! revision_metadata=$(api_get "$revision" "$REVISION_FIELDS" 2>&1); then
              echo "::error::Could not read safe metadata for revision $short_revision"
              echo "$revision_metadata"
              rc=1
              continue
            fi
            printf '%s' "$revision_metadata" | node src/deploy/env-audit.mjs || rc=1
          done

          unset access_token
          if [ "$rc" -ne 0 ]; then
            echo "::error::Cloud Run environment metadata does not match the reviewed contract."
          fi
          exit "$rc"
